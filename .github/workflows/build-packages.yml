name: Build and Release Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic execution test
        run: |
          chmod +x count_files.sh
          ./count_files.sh . sh
      - name: Help output test
        run: ./count_files.sh --help

  build-rpm:
    name: Build RPM (Fedora ${{ matrix.fedora_version }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora_version: [39, 40]
    container: fedora:${{ matrix.fedora_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache DNF packages
        uses: actions/cache@v3
        with:
          path: /var/cache/dnf
          key: ${{ runner.os }}-dnf-${{ matrix.fedora_version }}-${{ hashFiles('packaging/rpm/count-files.spec') }}
          restore-keys: |
            ${{ runner.os }}-dnf-${{ matrix.fedora_version }}-

      - name: Install build tools
        run: dnf install -y rpm-build rpmdevtools tar

      - name: Setup RPM build environment
        run: rpmdev-setuptree

      - name: Prepare sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES/count-files-2.0
          cp count_files.sh count_files.conf count_files.1 ~/rpmbuild/SOURCES/count-files-2.0/
          cd ~/rpmbuild/SOURCES
          tar czvf count-files-2.0.tar.gz count-files-2.0

      - name: Copy spec file
        run: cp packaging/rpm/count-files.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/count-files.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package-fedora-${{ matrix.fedora_version }}
          path: /github/home/rpmbuild/RPMS/noarch/*.rpm

  build-deb:
    name: Build DEB (Ubuntu ${{ matrix.ubuntu_version }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu_version: [22.04, 24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ matrix.ubuntu_version }}-${{ hashFiles('packaging/deb/debian/control') }}
          restore-keys: |
            ${{ runner.os }}-apt-${{ matrix.ubuntu_version }}-

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts

      - name: Prepare build directory
        run: |
          mkdir -p build/count-files-2.0
          cp count_files.sh count_files.conf count_files.1 build/count-files-2.0/
          cp -r packaging/deb/debian build/count-files-2.0/

      - name: Build DEB
        run: |
          cd build/count-files-2.0
          dpkg-buildpackage -us -uc -b

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package-ubuntu-${{ matrix.ubuntu_version }}
          path: build/*.deb

  release:
    name: Create Release
    needs: [build-rpm, build-deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.rpm
            artifacts/**/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
